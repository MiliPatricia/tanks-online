<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Танчики Онлайн PRO</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        /* Стили Меню */
        #menu {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 400px;
            width: 92%;
            border: 1px solid #333;
            z-index: 10;
        }
        h1 { margin: 0 0 15px 0; color: #4CAF50; font-size: 28px; text-transform: uppercase; letter-spacing: 1px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #111;
            color: white;
            width: 100%;
            text-align: center;
            outline: none;
        }
        input:focus { border-color: #4CAF50; }
        #join-id { text-transform: uppercase; font-weight: bold; letter-spacing: 2px; }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 14px;
            margin: 6px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: transform 0.1s, background 0.2s;
        }
        button:active { transform: scale(0.98); }
        button.secondary { background: #2196F3; }
        .divider { margin: 12px 0; color: #666; font-size: 12px; text-transform: uppercase; }
        #status { margin-top: 12px; color: #ffeb3b; font-size: 14px; min-height: 20px; word-break: break-word; }

        /* Игровой интерфейс */
        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 100vh;
            padding-top: 8px;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 95%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #333;
        }
        .p1-hud { color: #4CAF50; }
        .p2-hud { color: #2196F3; }
        
        /* Адаптивный Canvas */
        #canvas-wrapper {
            position: relative;
            width: 95%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            max-height: 62vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            background: #1c1c1c;
            border: 3px solid #444;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            object-fit: contain;
        }

        /* Мобильное управление (Геймпад) */
        #mobile-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 95%;
            max-width: 800px;
            margin-top: auto;
            margin-bottom: 15px;
            padding: 5px 10px;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(2, 56px);
            gap: 6px;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.25);
            color: white;
            border-radius: 12px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        .ctrl-btn.active {
            background: rgba(76, 175, 80, 0.5);
            border-color: #4CAF50;
            transform: scale(0.94);
        }
        .fire-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(244, 67, 54, 0.35);
            border: 3px solid #f44336;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }
        .fire-btn.active {
            background: rgba(244, 67, 54, 0.8);
            transform: scale(0.92);
        }
        .pc-hint {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }
        @media (min-width: 850px) and (pointer: fine) {
            #canvas-wrapper { max-height: 75vh; }
        }
    </style>
</head>
<body>

    <!-- МЕНЮ -->
    <div id="menu">
        <h1>Танчики PRO</h1>
        
        <div class="input-group">
            <label>Ваш игровой никнейм:</label>
            <input type="text" id="player-name" placeholder="Введите имя..." maxlength="12" value="Танкист">
        </div>

        <button onclick="createGame()">Создать комнату (Хост)</button>
        
        <div class="divider">— или войти к другу —</div>
        
        <input type="text" id="join-id" placeholder="КОД КОМНАТЫ">
        <button class="secondary" onclick="joinGame()">Подключиться</button>
        
        <div id="status">Готов к бою</div>
    </div>

    <!-- ИГРА -->
    <div id="game-container">
        <div id="hud">
            <div class="p1-hud"><span id="name1">Хост</span>: <span id="score1">0</span></div>
            <div style="color:#888; font-size:12px;">ДО 5 ПОБЕД</div>
            <div class="p2-hud"><span id="name2">Гость</span>: <span id="score2">0</span></div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>

        <div class="pc-hint">На ПК: WASD / Стрелки + Пробел | На телефоне: Кнопки ниже</div>

        <!-- Сенсорные кнопки для телефона -->
        <div id="mobile-controls">
            <div class="d-pad">
                <div></div>
                <div class="ctrl-btn" id="btn-up">▲</div>
                <div></div>
                <div class="ctrl-btn" id="btn-left">◀</div>
                <div class="ctrl-btn" id="btn-down">▼</div>
                <div class="ctrl-btn" id="btn-right">▶</div>
            </div>
            <div class="fire-btn" id="btn-shoot">ОГОНЬ</div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    let peer = null;
    let conn = null;
    let isHost = false;
    let gameRunning = false;
    let myName = "Танкист";

    // Локальные и сетевые клавиши
    const keys = { up: false, down: false, left: false, right: false, shoot: false };
    let remoteKeys = { up: false, down: false, left: false, right: false, shoot: false };

    let cooldown1 = 0;
    let cooldown2 = 0;
    let powerupTimer = 300;

    // Состояние игры
    let state = {
        p1: { x: 80, y: 300, angle: 0, hp: 100, score: 0, name: "Хост", shield: 0, speedBoost: 0 },
        p2: { x: 720, y: 300, angle: Math.PI, hp: 100, score: 0, name: "Гость", shield: 0, speedBoost: 0 },
        bullets: [],
        walls: [],
        powerups: [],
        particles: []
    };

    // Генерация карты (1 - Кирпич разрушаемый, 2 - Сталь вечная)
    function initMap() {
        state.walls = [];
        const layout = [
            // Стальные блоки в центре и по углам
            { x: 380, y: 260, w: 40, h: 80, type: 2, hp: 999 },
            { x: 160, y: 120, w: 40, h: 80, type: 2, hp: 999 },
            { x: 160, y: 400, w: 40, h: 80, type: 2, hp: 999 },
            { x: 600, y: 120, w: 40, h: 80, type: 2, hp: 999 },
            { x: 600, y: 400, w: 40, h: 80, type: 2, hp: 999 },
        ];

        // Добавляем кирпичные стены рядами
        for (let y = 200; y < 400; y += 40) {
            layout.push({ x: 160, y: y, w: 40, h: 40, type: 1, hp: 3 });
            layout.push({ x: 600, y: y, w: 40, h: 40, type: 1, hp: 3 });
        }
        for (let x = 280; x <= 480; x += 40) {
            if (x !== 380) {
                layout.push({ x: x, y: 140, w: 40, h: 40, type: 1, hp: 3 });
                layout.push({ x: x, y: 420, w: 40, h: 40, type: 1, hp: 3 });
            }
        }
        for (let y = 60; y <= 180; y += 40) {
            layout.push({ x: 380, y: y, w: 40, h: 40, type: 1, hp: 3 });
            layout.push({ x: 380, y: 500 - (y - 60), w: 40, h: 40, type: 1, hp: 3 });
        }

        state.walls = layout;
        state.powerups = [];
        state.bullets = [];
    }

    function generateCode() {
        return Math.random().toString(36).substring(2, 7).toUpperCase();
    }

    function getMyName() {
        const val = document.getElementById('player-name').value.trim();
        return val ? val.substring(0, 12) : "Танкист";
    }

    // --- СЕТЕВАЯ ЧАСТЬ (PeerJS) ---
    function createGame() {
        myName = getMyName();
        state.p1.name = myName;
        const roomCode = "TANKPRO-" + generateCode();
        statusText.innerText = "Создание сервера...";

        peer = new Peer(roomCode);
        peer.on('open', (id) => {
            const shortCode = id.replace("TANKPRO-", "");
            statusText.innerHTML = `Код комнаты: <b style="font-size:22px; color:#4CAF50;">${shortCode}</b><br>Ждем подключения друга...`;
            isHost = true;
            initMap();
        });

        peer.on('connection', (connection) => {
            conn = connection;
            conn.on('open', () => {
                startGame();
            });
            conn.on('data', (data) => {
                if (data.type === 'join') {
                    state.p2.name = data.name;
                    updateHUD();
                } else if (data.type === 'input') {
                    remoteKeys = data.keys;
                }
            });
            conn.on('close', () => { alert("Друг отключился!"); location.reload(); });
        });
        peer.on('error', (err) => statusText.innerText = "Ошибка: " + err.type);
    }

    function joinGame() {
        myName = getMyName();
        const code = document.getElementById('join-id').value.trim().toUpperCase();
        if (!code) { statusText.innerText = "Введите код комнаты!"; return; }

        statusText.innerText = "Подключение к Хосту...";
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect("TANKPRO-" + code);
            conn.on('open', () => {
                isHost = false;
                conn.send({ type: 'join', name: myName });
                startGame();
            });
            conn.on('data', (data) => {
                if (data.type === 'state') {
                    state = data.state;
                    updateHUD();
                }
            });
            conn.on('close', () => { alert("Связь с Хостом потеряна!"); location.reload(); });
        });
        peer.on('error', () => statusText.innerText = "Комната не найдена!");
    }

    function startGame() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        updateHUD();
        gameRunning = true;
        requestAnimationFrame(gameLoop);
    }

    // --- УПРАВЛЕНИЕ (Клавиатура + Сенсорный экран) ---
    function sendInputIfGuest() {
        if (!isHost && conn && conn.open) {
            conn.send({ type: 'input', keys: keys });
        }
    }

    window.addEventListener('keydown', (e) => handleKey(e.code, true));
    window.addEventListener('keyup', (e) => handleKey(e.code, false));

    function handleKey(code, isPressed) {
        if (code === 'KeyW' || code === 'ArrowUp') keys.up = isPressed;
        if (code === 'KeyS' || code === 'ArrowDown') keys.down = isPressed;
        if (code === 'KeyA' || code === 'ArrowLeft') keys.left = isPressed;
        if (code === 'KeyD' || code === 'ArrowRight') keys.right = isPressed;
        if (code === 'Space') keys.shoot = isPressed;
        sendInputIfGuest();
    }

    // Настройка мобильных кнопок (Мультитач)
    function bindTouchButton(btnId, keyName) {
        const btn = document.getElementById(btnId);
        
        const press = (e) => {
            e.preventDefault();
            keys[keyName] = true;
            btn.classList.add('active');
            sendInputIfGuest();
        };
        const release = (e) => {
            e.preventDefault();
            keys[keyName] = false;
            btn.classList.remove('active');
            sendInputIfGuest();
        };

        btn.addEventListener('touchstart', press, { passive: false });
        btn.addEventListener('touchend', release, { passive: false });
        btn.addEventListener('touchcancel', release, { passive: false });
        
        // Поддержка кликов мышкой по кнопкам
        btn.addEventListener('mousedown', press);
        btn.addEventListener('mouseup', release);
        btn.addEventListener('mouseleave', release);
    }

    bindTouchButton('btn-up', 'up');
    bindTouchButton('btn-down', 'down');
    bindTouchButton('btn-left', 'left');
    bindTouchButton('btn-right', 'right');
    bindTouchButton('btn-shoot', 'shoot');

    // --- ФИЗИКА И ИГРОВАЯ ЛОГИКА (На стороне Хоста) ---
    function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 4;
            state.particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 15 + Math.random() * 15,
                color: color,
                size: 2 + Math.random() * 3
            });
        }
    }

    function checkTankWallCollision(x, y, radius) {
        if (x - radius < 0 || x + radius > canvas.width || y - radius < 0 || y + radius > canvas.height) return true;
        for (let w of state.walls) {
            if (x + radius > w.x && x - radius < w.x + w.w && y + radius > w.y && y - radius < w.y + w.h) {
                return true;
            }
        }
        return false;
    }

    function moveTank(tank, input, ownerId) {
        if (tank.shield > 0) tank.shield--;
        if (tank.speedBoost > 0) tank.speedBoost--;

        const baseSpeed = tank.speedBoost > 0 ? 4.3 : 2.8;
        const rotSpeed = tank.speedBoost > 0 ? 0.075 : 0.055;

        if (input.left) tank.angle -= rotSpeed;
        if (input.right) tank.angle += rotSpeed;

        let moveStep = 0;
        if (input.up) moveStep = baseSpeed;
        if (input.down) moveStep = -baseSpeed * 0.75;

        if (moveStep !== 0) {
            const nx = tank.x + Math.cos(tank.angle) * moveStep;
            const ny = tank.y + Math.sin(tank.angle) * moveStep;
            if (!checkTankWallCollision(nx, tank.y, 17)) tank.x = nx;
            if (!checkTankWallCollision(tank.x, ny, 17)) tank.y = ny;
        }

        // Подбор бонусов
        for (let i = state.powerups.length - 1; i >= 0; i--) {
            let p = state.powerups[i];
            if (Math.hypot(tank.x - p.x, tank.y - p.y) < 28) {
                if (p.type === 'heal') tank.hp = Math.min(100, tank.hp + 40);
                if (p.type === 'shield') tank.shield = 300; // 5 секунд щита
                if (p.type === 'speed') tank.speedBoost = 360; // 6 секунд ускорения
                spawnParticles(p.x, p.y, '#ffffff', 12);
                state.powerups.splice(i, 1);
            }
        }

        // Стрельба
        let cd = (ownerId === 1) ? cooldown1 : cooldown2;
        if (cd > 0) cd--;

        if (input.shoot && cd === 0) {
            const bx = tank.x + Math.cos(tank.angle) * 25;
            const by = tank.y + Math.sin(tank.angle) * 25;
            state.bullets.push({
                x: bx, y: by,
                vx: Math.cos(tank.angle) * 8.5,
                vy: Math.sin(tank.angle) * 8.5,
                owner: ownerId,
                bounces: 1 // 1 рикошет разрешен
            });
            spawnParticles(bx, by, '#ffeb3b', 5);
            cd = tank.speedBoost > 0 ? 20 : 35;
        }

        if (ownerId === 1) cooldown1 = cd;
        else cooldown2 = cd;
    }

    function spawnPowerup() {
        if (state.powerups.length >= 3) return;
        const types = ['heal', 'shield', 'speed'];
        const type = types[Math.floor(Math.random() * types.length)];
        
        for (let attempt = 0; attempt < 20; attempt++) {
            const rx = 60 + Math.random() * (canvas.width - 120);
            const ry = 60 + Math.random() * (canvas.height - 120);
            if (!checkTankWallCollision(rx, ry, 25)) {
                state.powerups.push({ x: rx, y: ry, type: type });
                break;
            }
        }
    }

    function updatePhysics() {
        moveTank(state.p1, keys, 1);
        moveTank(state.p2, remoteKeys, 2);

        // Таймер бонусов
        powerupTimer--;
        if (powerupTimer <= 0) {
            spawnPowerup();
            powerupTimer = 350 + Math.random() * 200;
        }

        // Обновление частиц
        for (let i = state.particles.length - 1; i >= 0; i--) {
            let pt = state.particles[i];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.life--;
            if (pt.life <= 0) state.particles.splice(i, 1);
        }

        // Обновление пуль
        for (let i = state.bullets.length - 1; i >= 0; i--) {
            let b = state.bullets[i];
            let prevX = b.x;
            let prevY = b.y;
            b.x += b.vx;
            b.y += b.vy;

            let destroyed = false;

            // Отскок от границ экрана
            if (b.x < 4 || b.x > canvas.width - 4) {
                if (b.bounces > 0) { b.vx = -b.vx; b.bounces--; spawnParticles(b.x, b.y, '#ffeb3b', 4); }
                else destroyed = true;
            }
            if (b.y < 4 || b.y > canvas.height - 4) {
                if (b.bounces > 0) { b.vy = -b.vy; b.bounces--; spawnParticles(b.x, b.y, '#ffeb3b', 4); }
                else destroyed = true;
            }

            if (destroyed) { state.bullets.splice(i, 1); continue; }

            // Столкновение со стенами
            for (let wIdx = state.walls.length - 1; wIdx >= 0; wIdx--) {
                let w = state.walls[wIdx];
                if (b.x + 4 > w.x && b.x - 4 < w.x + w.w && b.y + 4 > w.y && b.y - 4 < w.y + w.h) {
                    if (w.type === 1) {
                        // Кирпичная стена разрушается
                        w.hp--;
                        spawnParticles(b.x, b.y, '#d84315', 8);
                        if (w.hp <= 0) {
                            spawnParticles(w.x + w.w/2, w.y + w.h/2, '#bf360c', 18);
                            state.walls.splice(wIdx, 1);
                        }
                        destroyed = true;
                    } else {
                        // Стальная стена дает рикошет
                        if (b.bounces > 0) {
                            if (prevX <= w.x || prevX >= w.x + w.w) b.vx = -b.vx;
                            else b.vy = -b.vy;
                            b.bounces--;
                            spawnParticles(b.x, b.y, '#00e5ff', 6);
                        } else {
                            spawnParticles(b.x, b.y, '#fff', 5);
                            destroyed = true;
                        }
                    }
                    break;
                }
            }

            if (destroyed) { state.bullets.splice(i, 1); continue; }

            // Проверка попадания в Танк 1
            if (Math.hypot(b.x - state.p1.x, b.y - state.p1.y) < 20) {
                if (b.owner !== 1 || b.bounces < 1) { // Своя пуля может ранить после рикошета!
                    if (state.p1.shield <= 0) {
                        state.p1.hp -= 25;
                        spawnParticles(state.p1.x, state.p1.y, '#4CAF50', 12);
                    } else {
                        spawnParticles(b.x, b.y, '#00e5ff', 10);
                    }
                    state.bullets.splice(i, 1);
                    if (state.p1.hp <= 0) {
                        state.p2.score++;
                        spawnParticles(state.p1.x, state.p1.y, '#ff5722', 35);
                        resetRound();
                        break;
                    }
                    continue;
                }
            }

            // Проверка попадания в Танк 2
            if (Math.hypot(b.x - state.p2.x, b.y - state.p2.y) < 20) {
                if (b.owner !== 2 || b.bounces < 1) {
                    if (state.p2.shield <= 0) {
                        state.p2.hp -= 25;
                        spawnParticles(state.p2.x, state.p2.y, '#2196F3', 12);
                    } else {
                        spawnParticles(b.x, b.y, '#00e5ff', 10);
                    }
                    state.bullets.splice(i, 1);
                    if (state.p2.hp <= 0) {
                        state.p1.score++;
                        spawnParticles(state.p2.x, state.p2.y, '#ff5722', 35);
                        resetRound();
                        break;
                    }
                    continue;
                }
            }
        }

        updateHUD();
        if (conn && conn.open) {
            conn.send({ type: 'state', state: state });
        }
    }

    function resetRound() {
        state.p1.x = 80;  state.p1.y = 300; state.p1.angle = 0;       state.p1.hp = 100; state.p1.shield = 0; state.p1.speedBoost = 0;
        state.p2.x = 720; state.p2.y = 300; state.p2.angle = Math.PI; state.p2.hp = 100; state.p2.shield = 0; state.p2.speedBoost = 0;
        state.bullets = [];

        // Если кто-то набрал 5 очков — перезапускаем всю карту
        if (state.p1.score >= 5 || state.p2.score >= 5) {
            initMap();
            state.p1.score = 0;
            state.p2.score = 0;
        }
    }

    function updateHUD() {
        document.getElementById('name1').innerText = state.p1.name;
        document.getElementById('score1').innerText = state.p1.score;
        document.getElementById('name2').innerText = state.p2.name;
        document.getElementById('score2').innerText = state.p2.score;
    }

    // --- ОТРИСОВКА ГРАФИКИ ---
    function drawTank(tank, color) {
        ctx.save();
        ctx.translate(tank.x, tank.y);
        ctx.rotate(tank.angle);

        // Эффект ускорения
        if (tank.speedBoost > 0) {
            ctx.shadowColor = '#ffeb3b';
            ctx.shadowBlur = 12;
        }

        // Гусеницы
        ctx.fillStyle = '#111';
        ctx.fillRect(-19, -19, 38, 7);
        ctx.fillRect(-19, 12, 38, 7);

        // Корпус
        ctx.fillStyle = color;
        ctx.fillRect(-15, -13, 30, 26);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-15, -13, 30, 26);

        // Башня
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fill();

        // Ствол
        ctx.fillStyle = '#ccc';
        ctx.fillRect(0, -3, 24, 6);
        ctx.restore();

        // Энергетический щит
        if (tank.shield > 0) {
            ctx.save();
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(tank.x, tank.y, 26 + Math.sin(Date.now() * 0.02) * 2, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(0, 229, 255, 0.15)';
            ctx.fill();
            ctx.restore();
        }

        // Имя игрока над танком
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(tank.name, tank.x, tank.y - 38);

        // Полоска HP
        ctx.fillStyle = '#333';
        ctx.fillRect(tank.x - 20, tank.y - 32, 40, 5);
        ctx.fillStyle = tank.hp > 50 ? '#4CAF50' : (tank.hp > 25 ? '#ff9800' : '#f44336');
        ctx.fillRect(tank.x - 20, tank.y - 32, (tank.hp / 100) * 40, 5);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Фоновая сетка
        ctx.strokeStyle = '#242424';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Отрисовка стен
        for (let w of state.walls) {
            if (w.type === 1) {
                // Кирпич (меняет цвет от повреждений)
                ctx.fillStyle = w.hp === 3 ? '#b7410e' : (w.hp === 2 ? '#8d3209' : '#5e2106');
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = '#3a1504';
                ctx.lineWidth = 2;
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            } else {
                // Стальная стена
                ctx.fillStyle = '#607d8b';
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = '#90a4ae';
                ctx.lineWidth = 2;
                ctx.strokeRect(w.x + 3, w.y + 3, w.w - 6, w.h - 6);
            }
        }

        // Отрисовка бонусов
        for (let p of state.powerups) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.beginPath();
            ctx.arc(0, 0, 13, 0, Math.PI * 2);
            if (p.type === 'heal') { ctx.fillStyle = '#4CAF50'; }
            if (p.type === 'shield') { ctx.fillStyle = '#00bcd4'; }
            if (p.type === 'speed') { ctx.fillStyle = '#ffc107'; }
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const symbol = p.type === 'heal' ? '+' : (p.type === 'shield' ? 'S' : '⚡');
            ctx.fillText(symbol, 0, 1);
            ctx.restore();
        }

        // Танки
        drawTank(state.p1, '#4CAF50');
        drawTank(state.p2, '#2196F3');

        // Пули
        for (let b of state.bullets) {
            ctx.fillStyle = b.bounces > 0 ? '#ffeb3b' : '#ff5722';
            ctx.beginPath();
            ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Частицы взрывов
        for (let pt of state.particles) {
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        }
    }

    function gameLoop() {
        if (!gameRunning) return;
        if (isHost) updatePhysics();
        draw();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
